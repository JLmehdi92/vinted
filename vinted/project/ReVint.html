<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ReVint — Extension & Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css?v=dark6">
<style>
  /* Tweak styles */
  .tweak-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 280px;
    background: var(--cream);
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    box-shadow: var(--shadow-pop);
    padding: 16px;
    font-family: var(--sans);
    font-size: 12px;
    z-index: 1000;
    display: none;
  }
  .tweak-panel.open { display: block; }
  .tweak-panel h4 {
    margin: 0 0 12px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    display: flex;
    justify-content: space-between;
  }
  .tweak-row { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tweak-row:last-child { border: none; }
  .tweak-label { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 6px; }
  .tweak-swatches { display: flex; gap: 6px; }
  .tweak-sw {
    width: 24px; height: 24px; border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .tweak-sw.active { border-color: var(--ink); }

  body {
    font-family: var(--sans);
    background: #f0eee9;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // TWEAK state (persisted via parent postMessage)
  window.TWEAKS = /*EDITMODE-BEGIN*/{
    "accent": "gold",
    "density": "comfortable",
    "darkHero": false
  }/*EDITMODE-END*/;

  const ACCENTS = {
    gold:    { gold: '#E8C547', goldDeep: '#C9A82E', goldWash: '#F9EFC8' },
    indigo:  { gold: '#6366F1', goldDeep: '#4F46E5', goldWash: '#E0E7FF' },
    coral:   { gold: '#FF7A59', goldDeep: '#E05A39', goldWash: '#FEE2D8' },
    emerald: { gold: '#10B981', goldDeep: '#059669', goldWash: '#D1FAE5' },
  };

  function applyTweaks() {
    const t = window.TWEAKS;
    const a = ACCENTS[t.accent] || ACCENTS.gold;
    document.documentElement.style.setProperty('--gold', a.gold);
    document.documentElement.style.setProperty('--gold-deep', a.goldDeep);
    document.documentElement.style.setProperty('--gold-wash', a.goldWash);
  }
  applyTweaks();

  // Tweaks editmode protocol
  window.addEventListener('message', (e) => {
    if (e.data?.type === '__activate_edit_mode') {
      document.getElementById('tweak-panel')?.classList.add('open');
    } else if (e.data?.type === '__deactivate_edit_mode') {
      document.getElementById('tweak-panel')?.classList.remove('open');
    }
  });
  window.parent.postMessage({type: '__edit_mode_available'}, '*');

  window.setTweak = function(key, value) {
    window.TWEAKS[key] = value;
    applyTweaks();
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[key]: value}}, '*');
    document.querySelectorAll(`[data-tweak="${key}"]`).forEach(el => {
      el.classList.toggle('active', el.dataset.value === String(value));
    });
  };
</script>

<!-- Tweak panel UI -->
<div id="tweak-panel" class="tweak-panel">
  <h4>Tweaks <span style="opacity:0.5">REVINT</span></h4>

  <div class="tweak-row">
    <span class="tweak-label">Couleur d'accent</span>
    <div class="tweak-swatches">
      <div class="tweak-sw active" data-tweak="accent" data-value="gold" style="background:#E8C547" onclick="setTweak('accent','gold')"></div>
      <div class="tweak-sw" data-tweak="accent" data-value="indigo" style="background:#6366F1" onclick="setTweak('accent','indigo')"></div>
      <div class="tweak-sw" data-tweak="accent" data-value="coral" style="background:#FF7A59" onclick="setTweak('accent','coral')"></div>
      <div class="tweak-sw" data-tweak="accent" data-value="emerald" style="background:#10B981" onclick="setTweak('accent','emerald')"></div>
    </div>
  </div>

  <div class="tweak-row" style="font-family:var(--mono); font-size:10px; color:var(--ink-4); letter-spacing:0.05em; line-height:1.5; text-transform:uppercase;">
    Naviguez entre les artboards avec la souris · molette pour zoom · glisser-déposer le fond pour pan
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="extension.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>

<script type="text/babel">

        <DCArtboard label="Étape 4 — lancer le repost" width={400} height={600}>

        </DCArtboard>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
